name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check localizations
        run: python3 -B scripts/check_strings.py
      - name: Unit tests
        run: scripts/test.sh
      - name: Build unsigned review DMG
        run: scripts/build.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict "build/Burrow.app"
      - name: Bundled rclone runs on both architectures
        run: |
          lipo "build/Burrow.app/Contents/Resources/rclone" -verify_arch arm64 x86_64
          lipo "build/Burrow.app/Contents/MacOS/Burrow" -verify_arch arm64 x86_64
      - name: Smoke test bundled frameworks
        run: test "$(\"build/Burrow.app/Contents/MacOS/Burrow\" --version)" = "$(cat VERSION)"
      - name: Integration tests (local SFTP server)
        run: scripts/integration.sh
